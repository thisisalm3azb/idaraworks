# Supabase local-stack config (CI integration stage + local dev when Docker is available).
# The pooler MUST run in transaction mode — CI proves the same Supavisor GUC mechanism
# the hosted project uses (S0 checklist §4 / VC-1).
project_id = "idaraworks"

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = true
port = 54329
pool_mode = "transaction"
default_pool_size = 5
max_client_conn = 50

# Review M1/M3: the project's own runner (tooling/scripts/migrate.ts, ledger
# app.migrations) is the SINGLE migration authority — in CI, locally, and hosted.
# The CLI must not auto-apply supabase/migrations/ (it would create real tables
# before the VC-1 gate and double-apply non-idempotent files afterwards).
# `supabase db push` is NOT this project's deploy path.
[db.migrations]
enabled = false

[db.seed]
enabled = false

[api]
enabled = true
port = 54321
schemas = ["public"]

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
# Phase E: files & storage foundation. Local/CI buckets are declared HERE
# (checklist §3: buckets via config, not SQL); hosted buckets are created by
# tooling/scripts/setup-storage.ts with the same names/caps/mimes.
enabled = true
file_size_limit = "25MiB"

[storage.buckets.tenant-media]
public = false
file_size_limit = "15MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[storage.buckets.tenant-docs]
public = false
file_size_limit = "25MiB"
allowed_mime_types = ["image/jpeg", "image/png", "image/webp"]

[auth]
# Phase C: identity. Local/CI: email signup without confirmations so integration
# tests run headlessly; hosted keeps confirmations ON (dashboard). Phone provider
# is configured on hosted only (Twilio Verify — owner OA-4); disabled locally.
#
# 005B.1 — LOCAL config only. This file governs `supabase start`, NOT the hosted
# project. The HOSTED Auth config is a dashboard owner action (see the 005B.1
# report / owner checklist): Site URL = https://idaraworks.vercel.app, the
# redirect allow-list below (production origin), and the token-hash email
# templates pointing at /auth/confirm. Production must never use a localhost
# Site URL — that was the root cause of the confirmation-link defect.
enabled = true
site_url = "http://localhost:3000"
# Include the SSR verification routes so a local email round trip resolves.
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:3000/auth/confirm",
  "http://localhost:3000/auth/callback",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = false
# Hosted template (dashboard) — Confirm signup & Reset password must link to the
# server-rendered token-hash route so verification is not tied to the initiating
# browser and never lands on localhost:
#   {{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=signup     (confirm signup)
#   {{ .RedirectTo }}&token_hash={{ .TokenHash }}&type=recovery   (reset password)
# where RedirectTo is the app's emailRedirectTo (…/auth/confirm?next=…).

[auth.sms]
enable_signup = false

[realtime]
enabled = false

[analytics]
enabled = false
